# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes: 
  internal: internal.yml

tasks:
  # * Linters
  lint:
    desc: Run license linters
    cmds:
      - for: [
          license-header,
        ]
        task: lint:{{.ITEM}}

  lint:license-header:
    desc: Run license header check
    internal: true
    preconditions:
      - sh: command -v reuse
        msg: "reuse is not installed. Please run `task install`"
      - sh: test -f REUSE.toml
        msg: "No REUSE.toml file found."
    cmds:
      - reuse lint --lines

  # * Init
  init:
    desc: Initialize the license
    silent: true
    internal: true
    cmds:
      - defer: echo "✅ License are initialized"

  # * Install
  install:
    desc: Install required tools
    cmds:
      - for: [
          reuse,
        ]
        task: internal:tools:brew
        vars:
          APP: '{{.ITEM}}'
