version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions-minor:
        update-types:
          - "minor"
          - "patch"
      # Batch major bumps into one PR (mirrors the downstream dependabot template);
      # proposed tag refs are converted to SHA pins manually after merge.
      github-actions-major:
        update-types:
          - "major"

