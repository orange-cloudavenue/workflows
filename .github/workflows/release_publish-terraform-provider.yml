name: "Publish release"
on:
  workflow_call:
    secrets:
        TOKEN:
          required: true
        GPG_PRIVATE_KEY:
          required: true
        PASSPHRASE:
          required: true
        METRICS_TARGET:
          required: true
        METRICS_TOKEN:
          required: true
    inputs:
        artifact-name:
            description: 'Release note artifact name'
            required: true
            type: string
        tag:
            description: 'Tag version number (Eg: v0.1.0)'
            required: true
            type: string
        repository:
            description: 'Repository to checkout'
            required: true
            type: string
permissions:
  contents: write
  packages: write
jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/setup-go/issues/424#issuecomment-2796487736
      - name: Setup tar default options
        shell: bash
        run: echo "TAR_OPTIONS=--skip-old-files" >> $GITHUB_ENV
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        name: Checkout
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          repository: ${{ inputs.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - id: release-notes-download
        name: Release Notes Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  #v8.0.2
        with:
            name: ${{ inputs.artifact-name }}
            path: /tmp

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        if: success()
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean -f .goreleaser.yml --release-notes=${{ steps.release-notes-download.outputs.download-path }}/${{ inputs.artifact-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          METRICS_TARGET: ${{ secrets.METRICS_TARGET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
