name: Fix License Headers

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to fix (eg: orange-cloudavenue/terraform-provider-cloudavenue)'
        required: true
        type: string
      ref:
        description: 'Git reference to fix (eg: main)'
        required: true
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-headers:
    name: "Fix Piled License Headers"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23
          
      - name: Install license-eye
        run: go install github.com/apache/skywalking-eyes/cmd/license-eye@latest
          
      - name: Fix old license identifiers
        run: |
          find . -type f -name "*.go" \
            -not -path "./.git/*" \
            -exec sed -i -e 's/Mozilla Public License 2\.0/MPL-2.0/g' -e 's/Apache License 2\.0/Apache-2.0/g' {} +
          
      - name: Run license-eye header fix
        run: license-eye header fix
          
      - name: Check if any files changed
        id: changed-files
        run: |
          git diff --exit-code || echo "any_changed=true" >> "$GITHUB_OUTPUT"
          
      - name: Commit and push changes
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: "chore: fix piled license headers"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
