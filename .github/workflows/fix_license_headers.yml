name: Fix License Headers

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to fix (eg: orange-cloudavenue/terraform-provider-cloudavenue)'
        required: true
        type: string
      ref:
        description: 'Git reference to fix (eg: main)'
        required: true
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-headers:
    name: "Deduplicate License Headers"
    runs-on: ubuntu-latest
    steps:
      # The cleaner script is taken from this (hub) repository so the fix run
      # always uses the latest version, even before sync delivered it to the
      # target repository.
      - name: Checkout workflows repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'

      - name: Install license-eye
        run: go install github.com/apache/skywalking-eyes/cmd/license-eye@a196742f472feaffafea537ce5a2a4c3c53a8de4  # v0.9.0

      # Collapse every piled/duplicated SPDX header into a single canonical
      # header. This never adds a header to a file and never stacks: files
      # without a license header are left untouched.
      - name: Collapse piled license headers
        run: node shared-files/license/clean-license-headers.mjs --root target

      # Gate: the target must carry the current synced .licenserc.yaml (the
      # pattern that tolerates the canonical header). If this fails, run the
      # template sync first, then re-dispatch this workflow.
      - name: Verify headers with license-eye
        working-directory: target
        run: license-eye header check

      - name: Check if any files changed
        id: changed-files
        working-directory: target
        run: |
          git diff --exit-code || echo "any_changed=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.SYNC_PAT }}
          path: target
          commit-message: "chore(license): deduplicate license headers"
          branch: fix/license-headers
          title: "chore: deduplicate license headers"
          body: |
            Collapses piled/duplicated SPDX license headers into a single canonical header per file.

            Caused by an overly strict `license-eye` header pattern: `header fix` kept
            prepending a new header on every run. The pattern shipped from the workflows
            hub is now normalized-tolerant, so headers never stack again.
          delete-branch: true
