name: Fix License Headers

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to fix (eg: orange-cloudavenue/terraform-provider-cloudavenue)'
        required: true
        type: string
      ref:
        description: 'Git reference to fix (eg: main)'
        required: true
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-headers:
    name: "Fix Piled License Headers"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23
          
      - name: Install license-eye
        run: go install github.com/apache/skywalking-eyes/cmd/license-eye@latest
          
      - name: Fix old license identifiers
        run: |
          find . -type f -name "*.go" \
            -not -path "./.git/*" \
            -exec sed -i -e 's/Mozilla Public License 2\.0/MPL-2.0/g' -e 's/Apache License 2\.0/Apache-2.0/g' {} +
          
      - name: Run license-eye header fix
        run: license-eye header fix
          
      - name: Check if any files changed
        id: changed-files
        run: |
          git diff --exit-code || echo "any_changed=true" >> "$GITHUB_OUTPUT"
          
      - name: Create Pull Request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.SYNC_PAT }}
          commit-message: "chore: fix piled license headers"
          branch: fix/license-headers
          title: "chore: fix piled license headers"
          body: |
            Fixes piled/duplicated license headers that were created by the old license-eye pattern.
            
            This PR removes duplicate headers and normalizes all files to the correct SPDX format.
          delete-branch: true
