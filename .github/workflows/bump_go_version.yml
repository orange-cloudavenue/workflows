name: Bump Go Version

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to update (eg: orange-cloudavenue/terraform-provider-cloudavenue)'
        required: true
        type: string
      ref:
        description: 'Git reference to update (eg: main)'
        required: true
        type: string
        default: main
      go-version:
        description: 'Go version to set, X.Y or X.Y.Z (eg: 1.26 or 1.26.8)'
        required: true
        type: string
      update-toolchain:
        description: 'Update existing toolchain directives as well'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-go-version:
    name: "Bump Go Version"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # `go get go@X.Y.Z` is the supported way to update Go module/workspace
      # metadata coherently: it preserves patch versions where declared and keeps
      # the surrounding requirements in sync. A toolchain line is only updated
      # when already present; the workflow still never adds one implicitly.
      - name: Rewrite go / toolchain directives
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          version='${{ inputs.go-version }}'
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::go-version '$version' is not X.Y or X.Y.Z"
            exit 1
          fi

          updated=0
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            before="$(cat "$file")"

            if [ "$(basename "$file")" = 'go.work' ]; then
              (
                cd "$dir"
                GOWORK=off go work edit -go="$version"
              )
            elif grep -Eq '^module ' "$file"; then
              (
                cd "$dir"
                GOWORK=off go get go@"$version"
                GOWORK=off go mod tidy
              )
            else
              continue
            fi

            if [ '${{ inputs.update-toolchain }}' = 'true' ] && grep -Eq '^toolchain go[0-9]' "$file"; then
              sed -i -E "s/^toolchain go[0-9].*$/toolchain go${version}/" "$file"
            fi

            if [ "$(cat "$file")" != "$before" ]; then
              echo "rewritten: $file"
              updated=$((updated + 1))
            fi
          done < <(find . \( -name go.mod -o -name go.work \) -not -path '*/vendor/*' -not -path '*/.git/*' | sort)

          while IFS= read -r workfile; do
            dir="$(dirname "$workfile")"
            (
              cd "$dir"
              GOWORK=off go work sync
            )
          done < <(find . -name go.work -not -path '*/vendor/*' -not -path '*/.git/*' | sort)

          echo "files-rewritten=$updated" >> "$GITHUB_OUTPUT"

      - name: Check if any files changed
        id: changed-files
        run: |
          if ! git diff --quiet; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: create-pull-request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ secrets.SYNC_PAT }}
          commit-message: "chore(deps): bump go version to ${{ inputs.go-version }}"
          branch: chore/bump-go-version-${{ inputs.go-version }}
          title: "chore(deps): bump Go version to ${{ inputs.go-version }}"
          body: |
            Sets the Go version to `${{ inputs.go-version }}` in every `go.mod` / `go.work` of this repository.

            - `go` directives updated with the Go toolchain itself in ${{ steps.bump.outputs.files-rewritten }} file(s)
            - existing `toolchain` directives optionally rewritten to `go${{ inputs.go-version }}`; none added where the module did not declare one

            Opened by `workflows/.github/workflows/bump_go_version.yml`; review the resulting `go.mod` diff before merging, and let the CI of this repository prove the module still builds.
          delete-branch: true

      - name: Add changelog entry
        if: steps.create-pull-request.outputs.pull-request-number != ''
        shell: bash
        run: |
          mkdir -p .changelog
          changelog_file=.changelog/${{ steps.create-pull-request.outputs.pull-request-number }}.txt
          {
            echo '```release-note:dependency'
            echo 'deps: bump Go version to ${{ inputs.go-version }}'
            echo '```'
          } > "$changelog_file"

      - name: Update Pull Request with changelog entry
        if: steps.create-pull-request.outputs.pull-request-number != ''
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ secrets.SYNC_PAT }}
          add-paths: .changelog/${{ steps.create-pull-request.outputs.pull-request-number }}.txt
          commit-message: "chore: add changelog for #${{ steps.create-pull-request.outputs.pull-request-number }}"
          branch: chore/bump-go-version-${{ inputs.go-version }}
          title: "chore(deps): bump Go version to ${{ inputs.go-version }}"
          body: |
            Sets the Go version to `${{ inputs.go-version }}` in every `go.mod` / `go.work` of this repository.

            - `go` directives updated with the Go toolchain itself in ${{ steps.bump.outputs.files-rewritten }} file(s)
            - existing `toolchain` directives optionally rewritten to `go${{ inputs.go-version }}`; none added where the module did not declare one

            Opened by `workflows/.github/workflows/bump_go_version.yml`; review the resulting `go.mod` diff before merging, and let the CI of this repository prove the module still builds.
          delete-branch: true

      - name: Nothing to do
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "Every go.mod / go.work already declares Go ${{ inputs.go-version }}."
