name: Bump Go Version

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to update (eg: orange-cloudavenue/terraform-provider-cloudavenue)'
        required: true
        type: string
      ref:
        description: 'Git reference to update (eg: main)'
        required: true
        type: string
        default: main
      go-version:
        description: 'Go version to set, X.Y or X.Y.Z (eg: 1.26 or 1.26.8)'
        required: true
        type: string
      update-toolchain:
        description: 'Update existing toolchain directives as well'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-go-version:
    name: "Bump Go Version"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The `go` directive takes a release series (X.Y) or an exact toolchain
      # (X.Y.Z); a toolchain line only pins the minimum, so rewriting it is
      # pointless - and wrong - when the module never declared one.
      - name: Rewrite go / toolchain directives
        id: bump
        run: |
          set -euo pipefail

          version='${{ inputs.go-version }}'
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::go-version '$version' is not X.Y or X.Y.Z"
            exit 1
          fi
          series="$(printf '%s' "$version" | cut -d. -f1-2)"
          echo "go-series=$series" >> "$GITHUB_OUTPUT"

          updated=0
          for file in $(find . \( -name go.mod -o -name go.work \) \
                        -not -path '*/vendor/*' -not -path '*/.git/*' | sort); do
            before="$(cat "$file")"

            if grep -Eq '^go [0-9]' "$file"; then
              sed -i -E "s/^go [0-9].*$/go ${series}/" "$file"
            else
              continue
            fi

            if [ '${{ inputs.update-toolchain }}' = 'true' ] && grep -Eq '^toolchain go[0-9]' "$file"; then
              sed -i -E "s/^toolchain go[0-9].*$/toolchain go${version}/" "$file"
            fi

            if [ "$(cat "$file")" != "$before" ]; then
              echo "rewritten: $file"
              updated=$((updated + 1))
            fi
          done

          echo "files-rewritten=$updated" >> "$GITHUB_OUTPUT"

      - name: Check if any files changed
        id: changed-files
        run: |
          if ! git diff --quiet; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.SYNC_PAT }}
          commit-message: "chore(deps): bump go version to ${{ inputs.go-version }}"
          branch: chore/bump-go-version-${{ inputs.go-version }}
          title: "chore(deps): bump Go version to ${{ inputs.go-version }}"
          body: |
            Sets the Go version to `${{ inputs.go-version }}` in every `go.mod` / `go.work` of this repository.

            - `go` directive rewritten to `${{ steps.bump.outputs.go-series }}` in ${{ steps.bump.outputs.files-rewritten }} file(s)
            - `toolchain` directives already present rewritten to `go${{ inputs.go-version }}`; none added where the module did not declare one

            Opened by `workflows/.github/workflows/bump_go_version.yml`; review the resulting `go.mod` diff before merging, and let the CI of this repository prove the module still builds.
          delete-branch: true

      - name: Nothing to do
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "Every go.mod / go.work already declares Go ${{ inputs.go-version }}."
