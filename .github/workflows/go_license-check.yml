name: "Golang License Check"

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git reference to checkout (eg: {{github.ref}})'
        required: true
        type: string
      repository:
        description: 'Repository to checkout (eg: {{github.repository}})'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-license:
    name: "Check Dependency Licenses"
    runs-on: ubuntu-latest
    # Not run on draft PRs or PRs from forks or dependabot
    if: |
       github.event.pull_request.draft == false &&
       ! github.event.pull_request.head.repo.fork &&
       github.actor != 'dependabot[bot]'
    steps:
      # https://github.com/actions/setup-go/issues/424#issuecomment-2796487736
      - name: Setup tar default options
        shell: bash
        run: echo "TAR_OPTIONS=--skip-old-files" >> $GITHUB_ENV
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          persist-credentials: false
      - name: Check if go.work exists
        id: check-go-work
        shell: bash
        run: |
          if [ -f "go.work" ]; then
            echo "go_version_file=go.work" >> $GITHUB_ENV
          else
            echo "go_version_file=go.mod" >> $GITHUB_ENV
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          check-latest: true
          go-version-file: ${{ env.go_version_file }}

      - name: Install go-licence-detector
        run: go install go.elastic.co/go-licence-detector@1629a841f26141067941aebe9328789358b90460  # v0.11.1

      - name: Check dependency licenses
        run: |
          go list -m -json all | go-licence-detector -includeIndirect -rules .go-license-rules.json
