name: Add issue/PR to project

on:
  workflow_call:
    secrets:
        TOKEN:
          required: true

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue/PR to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05
        with:
          # You can target a project in a different organization
          # to the issue
          project-url: https://github.com/orgs/orange-cloudavenue/projects/18
          github-token: ${{ secrets.TOKEN }}
