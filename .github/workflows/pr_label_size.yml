name: "PR Size"

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git reference to checkout (eg: {{github.ref}})'
        required: true
        type: string
      repository:
        description: 'Repository to checkout (eg: {{github.repository}})'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-label-size:
    name: "Calculate PR Size"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
      - name: Label PR based on size
        uses: cbrgm/pr-size-labeler-action@371213a8a3de4b4c8f107ec8adcbb7ca293e970f
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pr_number: ${{ github.event.number }}
          config_file_path: '.github/pull-request-size.yml'
