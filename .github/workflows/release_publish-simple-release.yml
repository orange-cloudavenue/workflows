name: "Publish release"
on:
  workflow_call:
    secrets:
        TOKEN:
          required: true
    inputs:
        artifact-name:
            description: 'Release note artifact name'
            required: true
            type: string
        tag:
            description: 'Tag version number (Eg: v0.1.0)'
            required: true
            type: string
        repository:
            description: 'Repository to checkout'
            required: true
            type: string
permissions:
  contents: write
jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        name: Checkout
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          repository: ${{ inputs.repository }}
      - id: release-notes-download
        name: Release Notes Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  #v8.0.1
        with:
            name: ${{ inputs.artifact-name }}
            path: /tmp
      - id: release-action
        name: Publish Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
            tag: ${{ inputs.tag }}
            bodyFile: "${{ steps.release-notes-download.outputs.download-path }}/${{ inputs.artifact-name }}"
            token: ${{ secrets.TOKEN }}
