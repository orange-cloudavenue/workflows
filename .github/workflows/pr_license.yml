name: "License Check"

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git reference to checkout (eg: {{github.ref}})'
        required: true
        type: string
      repository:
        description: 'Repository to checkout (eg: {{github.repository}})'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  header-license:
    name: "Check License Header"
    runs-on: ubuntu-latest
    # Not run on draft PRs or PRs from forks or dependabot
    if: |
       github.event.pull_request.draft == false &&
       ! github.event.pull_request.head.repo.fork &&
       github.actor != 'dependabot[bot]'
    steps:
      # https://github.com/actions/setup-go/issues/424#issuecomment-2796487736
      - name: Setup tar default options
        shell: bash
        run: echo "TAR_OPTIONS=--skip-old-files" >> $GITHUB_ENV
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Install reuse
        run: sudo apt-get update && sudo apt-get install -y reuse

      - name: REUSE Compliance Check
        run: reuse lint --lines
