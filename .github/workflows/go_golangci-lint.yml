name: "GolangCI Lint"

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git reference to checkout (eg: {{github.ref}})'
        required: true
        type: string
      repository:
        description: 'Repository to checkout (eg: {{github.repository}})'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-lint-requirements:
    runs-on: ubuntu-latest
    name: "Check Lint Requirements"
    outputs:
      need-lint: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  #v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'

  golangci-lint:
    if: ${{ needs.check-lint-requirements.outputs.need-lint == 'true' }}
    needs: check-lint-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lint-${{ inputs.repository }}-${{ github.ref }}
      cancel-in-progress: true
    name: "GolangCI Lint"
    steps:
      # https://github.com/actions/setup-go/issues/424#issuecomment-2796487736
      - name: Setup tar default options
        shell: bash
        run: echo "TAR_OPTIONS=--skip-old-files" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          persist-credentials: false
      - name: Check if go.work exists
        id: check-go-work
        shell: bash
        run: |
          if [ -f "go.work" ]; then
            echo "go_version_file=go.work" >> $GITHUB_ENV
          else
            echo "go_version_file=go.mod" >> $GITHUB_ENV
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
           # Dynamically set the Go version file
          go-version-file: ${{ env.go_version_file }}
      - name: Install dependencies
        shell: bash
        run: go mod download
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          args: --timeout=10m
          version: v2.15.0
      # Advisory (non-blocking): findings appear in the job log without failing the check.
      - name: Run advisory linters
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: golangci-lint run --enable-only=paralleltest --timeout=5m ./...

  security:
    if: ${{ needs.check-lint-requirements.outputs.need-lint == 'true' }}
    needs: check-lint-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: go-security-${{ inputs.repository }}-${{ github.ref }}
      cancel-in-progress: true
    name: "Go Security & Deps"
    steps:
      # https://github.com/actions/setup-go/issues/424#issuecomment-2796487736
      - name: Setup tar default options
        shell: bash
        run: echo "TAR_OPTIONS=--skip-old-files" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          persist-credentials: false
      - name: Check if go.work exists
        id: check-go-work
        shell: bash
        run: |
          if [ -f "go.work" ]; then
            echo "go_version_file=go.work" >> $GITHUB_ENV
          else
            echo "go_version_file=go.mod" >> $GITHUB_ENV
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ env.go_version_file }}
      - name: Verify module integrity
        run: go mod verify
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
