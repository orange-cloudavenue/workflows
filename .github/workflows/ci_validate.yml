name: CI Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-sync-yml:
    name: Validate sync.yml structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
      - name: Validate sync.yml is valid YAML
        run: |
          python3 -c "
          import yaml, sys
          try:
              with open('sync.yml') as f:
                  data = yaml.safe_load(f)
              print('sync.yml: valid YAML')
              groups = data.get('group', [])
              for i, group in enumerate(groups):
                  files = group.get('files', [])
                  repos = group.get('repos', '')
                  print(f'  Group {i+1}: {len(files)} files, {len(repos.splitlines())} repos')
              print('Structure validation passed')
          except yaml.YAMLError as e:
              print(f'YAML Error: {e}')
              sys.exit(1)
          "
      # Source-existence is validated strictly (hard failure) by
      # scripts/validate-rendered-templates.mjs in the render-validate job.

  render-validate:
    name: Render and validate all template variants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pinned template dependencies
        # Exact versions; must stay compatible with repo-file-sync-action's
        # nunjucks rendering behavior (autoescape/trimBlocks/lstripBlocks).
        run: npm install --no-save --no-package-lock --no-fund --no-audit nunjucks@3.2.4 js-yaml@4.1.0
      - name: Render every sync.yml variant and validate outputs
        run: node scripts/validate-rendered-templates.mjs
