name: Plumber

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  plumber:
    name: "Plumber CI/CD Security Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@d3536bae4727b9290d9e69ee25c4350ddbcd91cd
        with:
          min-score: A
